<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeBot Pro — Demo</title><style>body{font-family:system-ui;background:#0c1220;color:#eef2ff;margin:0}main{max-width:850px;margin:auto;padding:28px 18px}h1{margin-bottom:4px}small{color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:24px 0}.card{background:#172238;padding:20px;border-radius:14px;border:1px solid #2b3b56}.label{color:#9aabc6;font-size:13px}.value{font-size:24px;font-weight:700;margin-top:8px}button{background:#4776f5;color:white;border:0;padding:13px 20px;border-radius:9px;font-weight:700;cursor:pointer}button:disabled{opacity:.45}pre{white-space:pre-wrap;word-break:break-word;color:#bed0ec}.warning{border-left:4px solid #e6ae46;padding:12px;background:#292538}</style></head><body><main><h1>TradeBot Pro</h1><small>Ambiente demonstrativo • Versão 0.1</small><p class="warning">Proteção ativa: somente contas virtuais. O bot ainda não executa contratos.</p><div class="grid"><div class="card"><div class="label">Conta</div><div class="value" id="connection">—</div></div><div class="card"><div class="label">Saldo virtual</div><div class="value" id="balance">—</div></div><div class="card"><div class="label">Execução</div><div class="value">Bloqueada</div></div></div><button onclick="connect()">Conectar conta demo</button><h2>Estado do sistema</h2><pre id="message">Carregando...</pre><h2>Próximos módulos</h2><p>Gráficos, indicadores EMA/RSI, backtest, simulação e controles de risco.</p></main><script>async function refresh(){try{const r=await fetch('/api/status');const s=await r.json();document.getElementById('connection').textContent=s.connected?'Conectada':'Desconectada';document.getElementById('balance').textContent=s.balance===null?'—':`${s.balance} ${s.currency}`;document.getElementById('message').textContent=s.message+(s.configured?'':'\nConfigure as variáveis de ambiente no servidor.')}catch(e){document.getElementById('message').textContent=String(e)}}async function connect(){const r=await fetch('/api/connect',{method:'POST'});const d=await r.json();if(!r.ok)alert(d.error);refresh()}refresh();setInterval(refresh,10000)</script></body></html>
